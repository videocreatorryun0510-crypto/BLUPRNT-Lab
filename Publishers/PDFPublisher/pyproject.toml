[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluprnt-pdf-publisher"
version = "0.1.0"
description = "A4 PDF Publisher Adapter for BLUPRNT Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bluprnt-publisher-core>=0.1,<1",
  "pydantic>=2.11,<3",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.16,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf_publisher = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "../../Packages/publisher-core/src",
  "../../Packages/knowledge-contracts/src",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pdf_publisher"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
