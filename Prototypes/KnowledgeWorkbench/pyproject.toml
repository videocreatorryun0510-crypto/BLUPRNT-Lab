[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluprnt-knowledge-workbench"
version = "0.3.0"
description = "Prototype workbench for AI to Knowledge JSON generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bluprnt-knowledge-contracts>=1.0,<2",
  "bluprnt-presentation-prompt-builder>=1.0,<2",
  "bluprnt-presentation-artifact>=1.0,<2",
  "bluprnt-presentation-artifact-registry>=1.0,<2",
  "bluprnt-provider-payload-resolver>=1.0,<2",
  "bluprnt-presentation-engine-adapter>=1.0,<2",
  "bluprnt-presentation-request-builder>=1.0,<2",
  "bluprnt-source-bundle-publisher>=1.0,<2",
  "fastapi>=0.116,<1",
  "openai>=1.93,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.16,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:../../Packages/knowledge-contracts/src:../../Packages/presentation-artifact-registry/src:../../Publishers/SourceBundlePublisher/src:../../Publishers/PresentationRequestBuilder/src:../../Publishers/ProviderPayloadResolver/src:../../Publishers/PresentationPromptBuilder/src:../../Publishers/PresentationEngineAdapter/src:../../Publishers/PresentationArtifact/src"
packages = ["knowledge_workbench"]
