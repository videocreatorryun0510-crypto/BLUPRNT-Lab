[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluprnt-knowledge-contracts"
version = "1.4.0"
description = "Versioned Knowledge JSON contracts for BLUPRNT Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_contracts = ["py.typed"]
