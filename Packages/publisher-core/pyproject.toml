[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluprnt-publisher-core"
version = "0.1.0"
description = "Vendor-neutral publication planning contracts for BLUPRNT Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bluprnt-knowledge-contracts>=1.1,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
publisher_core = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "../knowledge-contracts/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["publisher_core"]
