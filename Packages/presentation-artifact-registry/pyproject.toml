[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluprnt-presentation-artifact-registry"
version = "1.0.0"
description = "Versioned approval registry for BLUPRNT Presentation Artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bluprnt-presentation-artifact>=1.0,<2",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "mypy>=1.16,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
presentation_artifact_registry = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "../../Publishers/PresentationArtifact/src",
  "../../Publishers/PresentationRequestBuilder/src",
  "../../Publishers/SourceBundlePublisher/src",
  "../knowledge-contracts/src",
  "../../Prototypes/KnowledgeWorkbench/src",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:../../Publishers/PresentationArtifact/src:../../Publishers/PresentationRequestBuilder/src:../../Publishers/SourceBundlePublisher/src:../knowledge-contracts/src:../../Prototypes/KnowledgeWorkbench/src"
packages = ["presentation_artifact_registry"]
