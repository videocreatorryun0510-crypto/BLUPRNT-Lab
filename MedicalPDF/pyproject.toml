[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bluprnt-medical-pdf"
version = "0.1.0"
description = "BLUPRNT Lab MedicalPDF A4 one-page prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11,<1",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
medicalpdf-phase1 = "medical_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["medical_pdf"]
